<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Changelog — VAS</title>
<meta name="description" content="VAS changelog: latest changes and version history (up to 7 major versions back). RU/EN.">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">VAS</div>
    <div class="brand-text">
      <h1 data-i18n="changelog">Changelog</h1>
      <p data-i18n="tagline">Draw and export bounding-box annotations.</p>
    </div>
  </div>
  <div class="top-actions">
    <div class="lang-pill">
      <button type="button" class="lang-choice active" data-lang="en">EN</button>
      <button type="button" class="lang-choice" data-lang="ru">RU</button>
    </div>
    <button type="button" class="btn ghost" id="theme-btn">Night</button>
    <a class="btn ghost" href="index.html" data-i18n="home">Home</a>
  </div>
</header>

<main class="shell narrow">
  <section class="panel">
    <div class="page-head">
      <h2 data-i18n="latestChanges">Latest changes</h2>
      <span class="version-badge" id="changelog-version">v0.0.0</span>
    </div>
    <ul class="changes" id="latest-changes"></ul>
  </section>

  <section class="panel">
    <div class="page-head">
      <h2 data-i18n="history">History</h2>
      <button type="button" class="btn ghost" id="pdf-btn" aria-disabled="true" data-i18n="downloadPdf">Download full history PDF</button>
    </div>
    <p class="hint" data-i18n="pdfDisabled">Full-history PDF is available after 7 major versions.</p>
    <div id="history-list" class="history-list"></div>
  </section>

  <footer class="footer">
    <span data-i18n="agree">By using this product you agree to the Privacy &amp; Policy.</span>
    <a id="privacy-link" href="privacy.html" data-i18n="privacy">Privacy &amp; Policy</a>
  </footer>
</main>

<script type="module" src="page.js"></script>
</body>
</html>
